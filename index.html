<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producción · Tablero de máquinas</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e3e1dc;--p:#b7791f;--c:#2563eb;--l:#15803d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.m{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mn{font-weight:600;font-size:16px;border:0;background:transparent;color:var(--tx);width:100%;padding:2px 0;font-family:inherit}
.cnt{font-size:12px;color:var(--mut);white-space:nowrap}
.add{display:flex;gap:6px;margin-bottom:10px}
input,select{font:inherit;color:var(--tx)}
.add input,.ctl input,.ctl select,#pw{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.add input{flex:1;min-width:0;background:var(--bg)}.add input.q{flex:0 0 70px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 10px}
.t{border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:8px;padding:8px;margin-bottom:8px}
.t.curso{border-left-color:var(--c)}.t.listo{border-left-color:var(--l)}
.tt{word-break:break-word}.tt b{color:var(--mut);font-weight:600}
.dt{font-size:12px;color:var(--mut);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.st{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;flex:1}
.st.pendiente{color:var(--p)}.st.curso{color:var(--c)}.st.listo{color:var(--l)}
.sm{padding:3px 8px;font-size:13px}.adv{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:8px}
.note{color:var(--mut);font-size:12px;margin-top:12px;display:flex;gap:10px;align-items:center}
.bar{display:flex;gap:8px;margin-bottom:12px}.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ctl #q{flex:1;min-width:180px}
.fc{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--l);border-radius:8px;padding:8px 10px;margin-bottom:8px;max-width:640px}
.fc .mm{font-size:12px;color:var(--mut)}
.lg{max-width:340px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
</style></head><body>
<div id="login" style="display:none"><div class="m lg"><h1>Tablero de producción</h1><input id="pw" type="password" placeholder="Clave del taller"><button class="adv" id="go">Entrar</button><div id="lm" class="sub"></div></div></div>
<div id="app" style="display:none">
<h1>Producción · Tablero de máquinas</h1>
<div class="sub">Agregá tareas a cada máquina y avanzalas: Pendiente → En curso → Listo. Tocá el nombre de una máquina para renombrarla.</div>
<div class="bar"><button id="tab0" class="adv">Activas</button><button id="tab1">Finalizadas</button></div>
<div class="grid" id="g"></div>
<div id="fin" style="display:none">
<div class="ctl"><input id="q" type="search" placeholder="Buscar finalizadas…"><select id="ms"></select><input id="d1" type="date" title="Desde"><input id="d2" type="date" title="Hasta"></div>
<div class="sub" id="fs"></div><div id="fl"></div></div>
<div class="note">Tablero compartido: los cambios se ven en vivo. <button class="sm" id="out">Salir</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pegá tus datos de Supabase ======
var SUPABASE_URL="https://jzdcspfwyrfsazkbsfvl.supabase.co";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZGNzcGZ3eXJmc2F6a2JzZnZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzcwMDAsImV4cCI6MjEwODUxMzAwMH0.i25mxTZLMjA9-KPpJtGPc9DTRCeL7DG3J-ddJ9M6jZE";
var EMAIL="taller@tiendacuis.com"; // el mismo email que cargues como usuario en Supabase
// =======================================================
var DEF=["Láser CO2 130W","Láser fibra 30W","DTF UV","Impresora"];
var ST=["pendiente","curso","listo"],LBL={pendiente:"Pendiente",curso:"En curso",listo:"Listo"};
var tasks=[],names=DEF.slice(),sb,started=false,tm;
var $=function(i){return document.getElementById(i)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fd(ts){return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function oo(t){return t.ord!=null?t.ord:t.ts}
function err(e){alert("No se pudo guardar: "+e.message)}
function save(t){
  var k=tasks.findIndex(function(x){return x.id===t.id});
  if(k<0)tasks.push(t);else tasks[k]=t;
  render();
  sb.from("tasks").upsert(t).then(function(r){if(r.error)err(r.error)});
}
function add(i,inp,q){
  var v=inp.value.trim();if(!v)return;
  var n=parseInt(q.value,10);
  save({id:uid(),m:i,title:v,qty:n>0?n:null,status:"pendiente",ts:Date.now(),ini:null,fin:null,ord:null});
  inp.value="";q.value="";
}
function move(id,d){
  var t=tasks.find(function(x){return x.id===id});if(!t)return;
  var k=ST.indexOf(t.status)+d;if(k<0||k>2)return;
  t=Object.assign({},t,{status:ST[k]});
  if(ST[k]==="pendiente")t.ini=null;
  if(ST[k]==="curso"&&!t.ini)t.ini=Date.now();
  t.fin=ST[k]==="listo"?Date.now():null;
  save(t);
}
function del(id){
  if(!confirm("¿Borrar esta tarea?"))return;
  tasks=tasks.filter(function(x){return x.id!==id});render();
  sb.from("tasks").delete().eq("id",id).then(function(r){if(r.error)err(r.error)});
}
function rename(i,v){
  names[i]=v.trim()||DEF[i];
  sb.from("config").upsert({id:"machines",names:names}).then(function(r){if(r.error)err(r.error)});
}
function reorder(id,dir){
  var t=tasks.find(function(x){return x.id===id});if(!t)return;
  var L=tasks.filter(function(x){return x.m===t.m&&x.status!=="listo"}).sort(function(a,b){return oo(a)-oo(b)});
  var k=L.findIndex(function(x){return x.id===id});
  if(dir==="top"){if(k<1)return;save(Object.assign({},t,{ord:oo(L[0])-1}));return}
  var j=k+dir;if(j<0||j>=L.length)return;
  var o=L[j];
  save(Object.assign({},t,{ord:oo(o)}));save(Object.assign({},o,{ord:oo(t)}));
}
function renderFin(){
  var s=$("ms"),cur=s.value;
  s.innerHTML='<option value="">Todas las máquinas</option>'+names.map(function(n,i){return '<option value="'+i+'">'+esc(n)+'</option>'}).join("");
  s.value=cur;
  var q=$("q").value.trim().toLowerCase(),ms=s.value,d1=$("d1").value,d2=$("d2").value;
  var a=d1?new Date(d1+"T00:00:00").getTime():0,b=d2?new Date(d2+"T23:59:59").getTime():Infinity;
  var all=tasks.filter(function(t){return t.status==="listo"});
  $("tab1").textContent="Finalizadas ("+all.length+")";
  var r=all.filter(function(t){var f=t.fin||0;return (!q||t.title.toLowerCase().indexOf(q)>-1)&&(ms===""||t.m===+ms)&&f>=a&&f<=b}).sort(function(x,y){return (y.fin||0)-(x.fin||0)});
  var tot=r.reduce(function(n,t){return n+(t.qty||0)},0);
  $("fs").textContent=r.length+" tareas encontradas"+(tot?" · "+tot+" unidades":"")+(r.length>200?" (se muestran las 200 más recientes)":"");
  var l=$("fl");l.innerHTML="";
  if(!r.length){l.innerHTML='<div class="empty">No hay tareas finalizadas con ese filtro</div>';return}
  r.slice(0,200).forEach(function(t){
    var e=document.createElement("div");e.className="fc";
    e.innerHTML='<div class="tt">'+esc(t.title)+(t.qty?' <b>× '+t.qty+'</b>':'')+'</div><div class="mm">'+esc(names[t.m]||"")+' · Creada: '+fd(t.ts)+(t.ini?' · Iniciada: '+fd(t.ini):'')+(t.fin?' · Finalizada: '+fd(t.fin):'')+'</div><div class="row"></div>';
    var bt=document.createElement("button");bt.className="sm";bt.textContent="Reabrir";bt.onclick=function(){move(t.id,-1)};
    e.querySelector(".row").appendChild(bt);l.appendChild(e);
  });
}
function render(){
  renderFin();
  var a=document.activeElement,keep=a&&a.dataset&&a.dataset.k,kv=a&&a.value,sel=a&&a.selectionStart;
  var g=$("g");g.innerHTML="";
  names.forEach(function(nm,i){
    var ts=tasks.filter(function(t){return t.m===i&&t.status!=="listo"}).sort(function(a,b){return oo(a)-oo(b)});
    var c=document.createElement("div");c.className="m";
    c.innerHTML='<div class="mh"><input class="mn" data-k="n'+i+'" value="'+esc(nm).replace(/"/g,"&quot;")+'"><span class="cnt">'+ts.length+' activas</span></div>'+
      '<div class="add"><input data-k="a'+i+'" placeholder="Nueva tarea…"><input class="q" data-k="q'+i+'" type="number" min="1" inputmode="numeric" placeholder="Cant."><button class="adv">+</button></div><div class="l"></div>';
    var l=c.querySelector(".l");
    if(!ts.length)l.innerHTML='<div class="empty">Sin tareas</div>';
    ts.forEach(function(t,idx){
      var e=document.createElement("div");e.className="t "+t.status;
      e.innerHTML='<div class="tt">'+esc(t.title)+(t.qty?' <b>× '+t.qty+'</b>':'')+'</div>'+
        '<div class="dt">Creada: '+fd(t.ts)+(t.ini?'<br>Iniciada: '+fd(t.ini):'')+'</div><div class="row"><span class="st '+t.status+'">'+LBL[t.status]+'</span></div>';
      var r=e.querySelector(".row");
      function btn(txt,title,fn,cls){var b=document.createElement("button");b.className="sm"+(cls?" "+cls:"");b.textContent=txt;b.title=title;b.onclick=fn;r.appendChild(b)}
      if(t.status!=="pendiente")btn("←","Volver",function(){move(t.id,-1)});
      btn(t.status==="pendiente"?"Iniciar":"Terminar","Avanzar",function(){move(t.id,1)},"adv");
      if(idx>0){btn("⤒","Arriba de todo",function(){reorder(t.id,"top")});btn("↑","Subir",function(){reorder(t.id,-1)})}
      if(idx<ts.length-1)btn("↓","Bajar",function(){reorder(t.id,1)});
      btn("✕","Borrar",function(){del(t.id)});
      l.appendChild(e);
    });
    var ai=c.querySelector(".add input"),qi=c.querySelector(".add input.q");
    ai.onkeydown=qi.onkeydown=function(e){if(e.key==="Enter")add(i,ai,qi)};
    c.querySelector(".add button").onclick=function(){add(i,ai,qi)};
    c.querySelector(".mn").onchange=function(e){rename(i,e.target.value)};
    g.appendChild(c);
  });
  if(keep){var el=g.querySelector('[data-k="'+keep+'"]');if(el){el.value=kv;el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
}
function tab(n){
  $("g").style.display=n?"none":"";$("fin").style.display=n?"":"none";
  $("tab0").className=n?"":"adv";$("tab1").className=n?"adv":"";
}
async function load(){
  var a=await sb.from("tasks").select("*");
  var c=await sb.from("config").select("*").eq("id","machines").maybeSingle();
  if(!a.error)tasks=a.data;
  if(c.data&&c.data.names)names=c.data.names;
  render();
}
function later(){clearTimeout(tm);tm=setTimeout(load,300)}
function start(){
  $("login").style.display="none";$("app").style.display="";
  if(started)return;started=true;
  load();
  sb.channel("taller").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},later)
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},later).subscribe();
}
function showLogin(){$("app").style.display="none";$("login").style.display=""}
$("tab0").onclick=function(){tab(0)};$("tab1").onclick=function(){tab(1)};
["q","ms","d1","d2"].forEach(function(id){var el=$(id);el.oninput=renderFin;el.onchange=renderFin});
function login(){
  $("lm").textContent="";
  sb.auth.signInWithPassword({email:EMAIL,password:$("pw").value}).then(function(r){
    if(r.error){$("lm").textContent="Clave incorrecta";return}
    $("pw").value="";start();
  });
}
$("go").onclick=login;$("pw").onkeydown=function(e){if(e.key==="Enter")login()};
$("out").onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
if(SUPABASE_URL.indexOf("PEGAR")===0){document.body.innerHTML='<p style="padding:20px">Falta pegar los datos de Supabase al principio del archivo index.html.</p>'}
else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.getSession().then(function(r){if(r.data.session)start();else showLogin()});
}
</script></body></html>
